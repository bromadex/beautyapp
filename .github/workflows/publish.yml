# Turns each folder in releases/ into a GitHub Release.
# Add releases/v1.2.3/ with the .apk, the .aab and NOTES.md, push this
# branch, and the release appears with the files attached. A version that
# already has a release is left alone.
name: Publish APK releases
on:
  push:
    branches: [apk-releases]
    paths: ['releases/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create missing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for dir in releases/v*/; do
            tag=$(basename "$dir")
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag already published"; continue
            fi
            files=$(find "$dir" -maxdepth 1 -type f \( -name '*.apk' -o -name '*.aab' \))
            [ -z "$files" ] && { echo "$tag has no files yet"; continue; }
            notes="$dir/NOTES.md"; [ -f "$notes" ] || notes=/dev/null
            gh release create "$tag" $files --title "BeauTap ${tag#v}" --notes-file "$notes" --target main
            echo "published $tag"
          done
