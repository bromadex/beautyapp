<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">
  <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY"></script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="BeauTap — beauty at your fingertips. Book trusted beauty professionals to your door.">
  <meta name="theme-color" content="#F5F6F3">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BeauTap">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>BeauTap</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; background: #F5F6F3; }
    #bt-loader {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: #F5F6F3; transition: opacity .35s ease; z-index: 9999;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #bt-loader .mark {
      width: 64px; height: 64px; border-radius: 20px; background: #0F3B31;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 800; font-size: 26px; letter-spacing: -1px;
      box-shadow: 0 10px 28px rgba(142, 59, 99, .25);
    }
    #bt-loader .name { color: #14201C; font-weight: 800; font-size: 20px; letter-spacing: -.4px; }
    #bt-loader .bar { width: 120px; height: 4px; border-radius: 4px; background: #E4EDE8; overflow: hidden; }
    #bt-loader .bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 4px; background: #0F3B31;
      animation: bt-slide 1.1s ease-in-out infinite;
    }
    @keyframes bt-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  </style>
</head>
<body>
  <div id="bt-loader" aria-label="Loading BeauTap">
    <div class="mark">B</div>
    <div class="name">BeauTap</div>
    <div class="bar"></div>
  </div>
  <script>
    (function () {
      var loader = document.getElementById('bt-loader');
      var obs = new MutationObserver(function () {
        if (document.querySelector('flutter-view, flt-glass-pane')) {
          obs.disconnect();
          setTimeout(function () {
            loader.style.opacity = '0';
            setTimeout(function () { loader.remove(); }, 400);
          }, 250);
        }
      });
      obs.observe(document.body, { childList: true, subtree: true });
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
